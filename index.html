<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
</head>

<body>

    <div class="container-lg">

        <header>
            <nav class="navbar navbar-expand-lg bg-body-tertiary">
                <div class="container">
                    <a class="navbar-brand" href="#home">My Dev Portfolio</a>

                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#portfolioNavbar" aria-controls="portfolioNavbar" aria-expanded="false"
                        aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <div class="collapse navbar-collapse" id="portfolioNavbar">
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item">
                                <a class="nav-link" href="#home">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#about">About</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#projects">Projects</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#contact">Contact</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>


        <main class="py-2">

            <section class="row justify-content-center text-center">
                <div class="col-md-10 col-lg-8">
                    <h1 class="title"> Computer Science Student | Aspiring Software Developer </h1>

                    <nav class="mt-4 d-flex flex-column flec-sm-row justify-content-center gap-2">
                        <a class="btn-lg" href="" role="button">
                            github
                        </a>
                        <a class="btn-lg" href="" role="button">
                            Linkedin
                        </a>
                    </nav>
                </div>
            </section>

            <section id="about">
                <h2>About Me</h2>
                <p></p>
            </section>

            <section id="projects">
                <h2>Projects</h2>
                <p></p>
            </section>

            <section id="contact">
                <h2>Contact</h2>
                <p></p>
            </section>
        </main>

        <footer class="text-center py-4 border-top">
            <nav class="d-flex justify-content-center flex-wrap gap-3">
                <a class="btn" href="" role="button">
                    github
                </a>
                <button id="backToTop" class="btn">
                    back to top
                </button>
            </nav>
        </footer>

    </div>
    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>

    <!-- Back to top button functionality -->
    <script>
        const backToTopButton = document.getElementById("backToTop");

        backToTopButton.addEventListener("click", function () {
            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        });
    </script>

    <!-- Scroll effect for navbar -->
    <script>
        const navbar = document.querySelector(".navbarScroll");

        window.addEventListener("scroll", function () {
            if (window.scrollY > 50) {
                navbar.classList.add("scrolled");
            } else {
                navbar.classList.remove("scrolled");
            }
        });
    </script>



</body>

</html>
